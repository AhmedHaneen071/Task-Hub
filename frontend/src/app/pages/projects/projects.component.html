<section class="page-header">
  <div class="header-main">
    <p class="eyebrow">Inventory</p>
    <h1>Projects</h1>
  </div>
</section>

<p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

<section class="workspace-grid">
  <aside class="glass-card panel sticky-aside">
    <h3>{{ editingProject ? 'Update Project' : 'New Project' }}</h3>
    <form [formGroup]="projectForm" (ngSubmit)="submitProject()">
      <div class="form-group">
        <label>Project Name</label>
        <input type="text" formControlName="name" placeholder="Enter name">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea rows="4" formControlName="description" placeholder="Project goals..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Status</label>
          <select formControlName="status">
            <option *ngFor="let option of statusOptions" [ngValue]="option.value">{{ option.label }}</option>
          </select>
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select formControlName="priority">
            <option *ngFor="let option of priorityOptions" [ngValue]="option.value">{{ option.label }}</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Category</label>
          <select formControlName="categoryId">
            <option *ngFor="let category of categories" [ngValue]="category.id">{{ category.name }}</option>
          </select>
        </div>
        <div class="form-group">
          <label>Due Date</label>
          <input type="date" formControlName="dueDate">
        </div>
      </div>

      <div class="form-group" *ngIf="isAdmin">
        <label>Project Owner</label>
        <select formControlName="ownerId">
          <option *ngFor="let owner of owners" [ngValue]="owner.id">{{ owner.fullName }}</option>
        </select>
      </div>

      <div class="action-row">
        <button class="primary-button" type="submit" [disabled]="saving">
          {{ saving ? 'Saving...' : (editingProject ? 'Save Changes' : 'Create Project') }}
        </button>
        <button class="secondary-button" type="button" *ngIf="editingProject" (click)="resetForm()">Cancel</button>
      </div>
    </form>
  </aside>

  <main class="project-list">
    <div class="glass-card filter-panel">
      <form [formGroup]="filterForm" class="filter-form">
        <input type="search" placeholder="Filter by name, category..." formControlName="search">
        <select formControlName="status">
          <option value="All">All Statuses</option>
          <option value="Planning">Planning</option>
          <option value="Active">Active</option>
          <option value="Blocked">Blocked</option>
          <option value="Completed">Completed</option>
        </select>
      </form>
    </div>

    <div class="loading" *ngIf="loading">Retrieving projects...</div>

    <div class="projects-container">
      <article class="glass-card project-card-v2" *ngFor="let project of filteredProjects">
        <div class="card-left">
          <div class="card-badge" [style.background]="project.categoryColor"></div>
          <div class="card-content">
            <h3><a [routerLink]="['/projects', project.id]">{{ project.name }}</a></h3>
            <p>{{ project.categoryName }} &middot; Owned by {{ project.ownerName }}</p>
          </div>
        </div>
        
        <div class="card-right">
          <span class="status-pill" [appStatusHighlight]="project.status">{{ project.status }}</span>
          <div class="card-actions">
            <button class="icon-button" (click)="editProject(project)" title="Edit">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button class="icon-button danger" (click)="deleteProject(project)" title="Delete">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </div>
      </article>
    </div>
  </main>
</section>
